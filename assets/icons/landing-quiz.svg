<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ทำโจทย์">
  <defs>
    <linearGradient id="lqPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#fff1d4"/>
    </linearGradient>
    <linearGradient id="lqBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4ff"/>
      <stop offset="1" stop-color="#8ec9f5"/>
    </linearGradient>
    <linearGradient id="lqPen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f2a03d"/>
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="58" rx="19" ry="3" fill="#000" opacity="0.09"/>

  <!-- แผ่นกระดาษด้านหลัง (เอียงนิดๆ ให้ดูเป็นปึก) -->
  <rect x="13" y="10" width="34" height="42" rx="6" fill="url(#lqBack)"
        stroke="#5aa7dd" stroke-width="2.5" stroke-linejoin="round" transform="rotate(-7 32 31)"/>

  <!-- แผ่นหน้า -->
  <rect x="15" y="12" width="34" height="42" rx="6" fill="url(#lqPaper)"
        stroke="#e0a75c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- โจทย์: 1 + 2 = ? -->
  <g stroke="#f0803c" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M22 24 v8"/>
    <path d="M20 25.5 L22 24"/>
  </g>
  <g stroke="#4fa9e0" stroke-width="3" stroke-linecap="round">
    <path d="M27.5 28 h5"/>
    <path d="M30 25.5 v5"/>
  </g>
  <!-- เลข 2 ต้องมีหัวโค้งจริงๆ ไม่งั้นย่อแล้วอ่านเป็นตัว z (เช็คจากภาพจริงแล้ว 2026-08-11) -->
  <path d="M36.2 26.4 a3 3 0 0 1 5.4 1.9 c0 2.4 -5.4 3.5 -5.4 5.7 h5.8"
        fill="none" stroke="#7bbf4a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- เส้นบรรทัดคำตอบ -->
  <g stroke="#f3d9ae" stroke-width="3" stroke-linecap="round">
    <path d="M22 39 h20"/>
    <path d="M22 46 h13"/>
  </g>

  <!-- ดินสอ -->
  <g transform="rotate(28 44 42)">
    <rect x="41" y="24" width="7" height="21" rx="2.6" fill="url(#lqPen)" stroke="#c9822c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M41 45 h7 l-3.5 6 z" fill="#ffe6bd" stroke="#c9822c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M43 49.2 h3 l-1.5 2.6 z" fill="#5b4636"/>
    <rect x="41" y="21" width="7" height="4.4" rx="2" fill="#ff9db2" stroke="#c9822c" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- ดาวให้กำลังใจ -->
  <path d="M50 12 l1.9 3.9 4.3.6 -3.1 3 .7 4.3 -3.8-2 -3.8 2 .7-4.3 -3.1-3 4.3-.6z"
        fill="#ffd23f" stroke="#e0a300" stroke-width="2" stroke-linejoin="round"/>
</svg>
